id = "fallthrough"
name = "Fallthrough"
version = "0.1.1"
schema_version = 1
authors = ["MrXie1109"]
description = "Fallthrough: syntax highlighting, and diagnostics from fallc --lsp."
repository = "https://github.com/MrXie1109/Fallthrough"

languages = ["languages/fallthrough"]
capabilities = []

[lib]
kind = "Rust"
version = "0.7.0"

# The grammar lives in this repository, in a subdirectory: Zed clones
# `repository`, checks out `rev`, and builds the parser at `path` inside it.
# `rev` must be a real commit -- an empty one is passed to `git checkout`, which
# rejects it -- and the parser is generated and committed, so the build only has
# to compile `src/parser.c`.
[grammars.fallthrough]
repository = "https://github.com/MrXie1109/Fallthrough"
rev = "e47d650aa4509078e6ed9e978369cd52adee17aa"
path = "editors/tree-sitter-fallthrough"

# The language server ships inside the compiler, so the extension starts it
# rather than bundling one: `src/lib.rs` decides which `fallc` to run.
[language_servers.fallc]
name = "Fallthrough (fallc)"
languages = ["Fallthrough"]
