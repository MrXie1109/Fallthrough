[package]
name = "fallthrough-zed"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"

# The extension is its own workspace, not a member of the compiler's.
#
# Zed builds an extension by running cargo in its own directory, and cargo
# refuses a package that sits inside another workspace without being listed in
# it -- `current package believes it's in a workspace when it's not`. The
# compiler's workspace does not list `editors/zed`, because an extension is
# built for `wasm32-wasip2` with a different toolchain and a dependency the
# compiler has no use for; declaring the boundary here is what tells cargo that
# this package is on its own.
[workspace]
